<!DOCTYPE html>
<html>
<head>
    <title>Smart Soil Analysis System</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #4CAF50, #2E7D32);
            color: white;
            text-align: center;
            padding: 30px;
        }

        .box {
            background: white;
            color: black;
            padding: 25px;
            border-radius: 15px;
            width: 350px;
            margin: auto;
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 6px;
        }

        button {
            padding: 10px 20px;
            background: #2E7D32;
            color: white;
            border: none;
            cursor: pointer;
        }

        h1 { margin-bottom: 10px; }
    </style>
</head>

<body>

<h1>🌾 Smart Soil Analysis System</h1>

<div class="box">

<input id="pH" placeholder="pH">
<input id="N" placeholder="Nitrogen">
<input id="P" placeholder="Phosphorus">
<input id="K" placeholder="Potassium">
<input id="M" placeholder="Moisture">
<input id="OC" placeholder="Organic Carbon">

<br><br>

<button onclick="predict()">Predict</button>

<h3 id="result"></h3>

</div>

<script>
function predict() {

    const data = {
        pH: parseFloat(document.getElementById("pH").value),
        Nitrogen: parseFloat(document.getElementById("N").value),
        Phosphorus: parseFloat(document.getElementById("P").value),
        Potassium: parseFloat(document.getElementById("K").value),
        Moisture: parseFloat(document.getElementById("M").value),
        Organic_Carbon: parseFloat(document.getElementById("OC").value)
    };

    fetch("/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(result => {
        document.getElementById("result").innerHTML =
            "🌱 Soil: " + result.Soil_Type + "<br>" +
            "🌾 Crop: " + result.Crop_Category + "<br>" +
            "💧 Irrigation: " + result.Irrigation_Type + "<br>" +
            "🌿 Fertility Score: " + result.Fertility_Score;
    });
}
</script>

</body>
</html>
